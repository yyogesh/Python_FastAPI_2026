[project]
name = "shopapi"
version = "0.1.0"
description = "E-commerce backend built in FastAPI"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]